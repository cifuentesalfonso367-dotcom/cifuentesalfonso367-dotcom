<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" style="stop-color:#0d1117" />
      <stop offset="100%" style="stop-color:#010409" />
    </radialGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Final Hex Logos -->
    <symbol id="hex-ts-safe" viewBox="0 0 100 100">
      <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" fill="#3178c6" stroke="#e2c275" stroke-width="2" />
      <text x="50" y="65" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="white" text-anchor="middle">TS</text>
    </symbol>

    <symbol id="hex-next-safe" viewBox="0 0 100 100">
      <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" fill="white" stroke="#e2c275" stroke-width="2" />
      <path d="M70 75 L40 35 H35 V65 H40 V40 L65 77 C66 76 68 75 70 74 Z" fill="black"/>
      <rect x="60" y="35" width="4" height="30" fill="black"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="20" />

  <!-- Snake Border -->
  <rect x="5" y="5" width="790" height="390" rx="15" fill="none" stroke="#e2c275" stroke-width="2" stroke-dasharray="80, 2300" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="2380" to="0" dur="5s" repeatCount="indefinite" />
  </rect>

  <g transform="translate(400, 200)">
    <!-- Nucleus -->
    <g filter="url(#glow)">
      <circle r="30" fill="none" stroke="#e2c275" stroke-width="1" opacity="0.3">
        <animate attributeName="r" values="28;32;28" dur="3s" repeatCount="indefinite" />
      </circle>
      <text y="5" font-family="'SF Pro Display', sans-serif" font-weight="700" font-size="14" fill="#e2c275" text-anchor="middle">IA</text>
    </g>

    <!-- Bounded Dynamic Orbits (Max radius 170 to stay in 400px height) -->
    <!-- Orbit 1 -->
    <g>
      <ellipse rx="170" ry="60" fill="none" stroke="#e2c275" stroke-width="1" opacity="0.5">
        <animate attributeName="rx" values="170;150;170" dur="6s" repeatCount="indefinite" />
        <animate attributeName="ry" values="60;80;60" dur="6s" repeatCount="indefinite" />
      </ellipse>
      <g>
        <use href="#hex-ts-safe" x="-25" y="-25" width="50" height="50" filter="url(#glow)" />
        <animateMotion path="M -170,0 A 170 60 0 0 1 170,0 A 170 60 0 0 1 -170,0" dur="8s" repeatCount="indefinite" />
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </g>

    <!-- Orbit 2 -->
    <g transform="rotate(60)">
      <ellipse rx="170" ry="60" fill="none" stroke="#e2c275" stroke-width="1" opacity="0.5">
        <animate attributeName="rx" values="150;170;150" dur="8s" repeatCount="indefinite" />
        <animate attributeName="ry" values="80;60;80" dur="8s" repeatCount="indefinite" />
      </ellipse>
      <g>
        <use href="#hex-next-safe" x="-25" y="-25" width="50" height="50" filter="url(#glow)" />
        <animateMotion path="M -170,0 A 170 60 0 0 1 170,0 A 170 60 0 0 1 -170,0" dur="10s" repeatCount="indefinite" />
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="35s" repeatCount="indefinite" />
    </g>

    <!-- Orbit 3 -->
    <g transform="rotate(-60)">
      <ellipse rx="170" ry="60" fill="none" stroke="#e2c275" stroke-width="1" opacity="0.5">
        <animate attributeName="rx" values="170;170;170" dur="10s" repeatCount="indefinite" />
        <animate attributeName="ry" values="60;100;60" dur="10s" repeatCount="indefinite" />
      </ellipse>
      <circle r="4" fill="#e2c275" opacity="0.8" filter="url(#glow)">
        <animateMotion path="M -170,0 A 170 60 0 0 1 170,0 A 170 60 0 0 1 -170,0" dur="7s" repeatCount="indefinite" />
      </circle>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="45" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="100" fill="#ffffff" text-anchor="middle" letter-spacing="12">EMMANUEL CIFUENTES</text>
  <text x="400" y="375" font-family="'SF Pro Display', sans-serif" font-size="12" font-weight="400" fill="#e2c275" text-anchor="middle" letter-spacing="6">INNOVACIÓN • ESTRATEGIA • DESARROLLO</text>

</svg>
