<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space Gradient Background -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020c1b;stop-opacity:1" />
    </radialGradient>
    
    <!-- Golden Sand Glow -->
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2c275;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#e2c275;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#e2c275;stop-opacity:0.1" />
    </linearGradient>

    <!-- TypeScript Symbol -->
    <symbol id="ts-icon" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="8" fill="#3178c6"/>
      <text x="50" y="75" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="white" text-anchor="middle">TS</text>
    </symbol>

    <!-- Next.js Symbol -->
    <symbol id="next-icon" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="90" fill="white"/>
      <path d="M149.508 157.52L69.142 54H54V125.97H66.1136V69.1836L139.999 164.345C143.333 162.222 146.503 159.947 149.508 157.52Z" fill="black"/>
      <rect x="115" y="54" width="12" height="72" fill="black"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-width="0.1" opacity="0.2">
    <path d="M0 200 L800 200 M400 0 L400 400" />
    <circle cx="400" cy="200" r="100" fill="none" />
    <circle cx="400" cy="200" r="180" fill="none" />
  </g>

  <!-- Atom Structure -->
  <g transform="translate(400, 200)">
    
    <!-- Orbits (Hilos del átomo) -->
    <!-- Orbit 1: Diagonal / -->
    <ellipse rx="180" ry="60" fill="none" stroke="url(#orbitGradient)" stroke-width="1.5" transform="rotate(45)" opacity="0.6" />
    <!-- Orbit 2: Diagonal \ -->
    <ellipse rx="180" ry="60" fill="none" stroke="url(#orbitGradient)" stroke-width="1.5" transform="rotate(-45)" opacity="0.6" />
    <!-- Orbit 3: Horizontal - -->
    <ellipse rx="180" ry="60" fill="none" stroke="url(#orbitGradient)" stroke-width="1.5" opacity="0.6" />

    <!-- Nucleus: IA -->
    <g filter="url(#goldGlow)">
      <circle r="30" fill="#e2c275" opacity="0.2">
        <animate attributeName="r" values="28;35;28" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle r="15" fill="#e2c275">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
      </circle>
      <text y="5" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#020c1b" text-anchor="middle">IA</text>
    </g>

    <!-- Electron 1: TypeScript on Orbit 1 -->
    <g>
      <use href="#ts-icon" x="-20" y="-20" width="40" height="40" filter="url(#goldGlow)" />
      <animateMotion 
        path="M -127,-127 A 180 60 45 0 1 127,127 A 180 60 45 0 1 -127,-127" 
        dur="6s" 
        repeatCount="indefinite" />
    </g>

    <!-- Electron 2: Next.js on Orbit 2 -->
    <g>
      <use href="#next-icon" x="-22" y="-22" width="44" height="44" filter="url(#goldGlow)" />
      <animateMotion 
        path="M 127,-127 A 180 60 -45 0 1 -127,127 A 180 60 -45 0 1 127,-127" 
        dur="5s" 
        repeatCount="indefinite" />
    </g>

    <!-- Electron 3: Innovation Pulse on Orbit 3 -->
    <g>
      <circle r="6" fill="#e2c275" filter="url(#goldGlow)">
        <animate attributeName="r" values="4;8;4" dur="1s" repeatCount="indefinite" />
      </circle>
      <animateMotion 
        path="M -180,0 A 180 60 0 0 1 180,0 A 180 60 0 0 1 -180,0" 
        dur="4s" 
        repeatCount="indefinite" />
    </g>

  </g>

  <!-- Footer Text -->
  <text x="400" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="300" fill="#e2c275" text-anchor="middle" letter-spacing="4">
    INNOVACIÓN • ESTRATEGIA • DESARROLLO
  </text>
  <text x="400" y="40" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    EMMANUEL CIFUENTES
  </text>

</svg>
