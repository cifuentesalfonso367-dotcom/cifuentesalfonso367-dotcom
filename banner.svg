<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c1b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a192f;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Logo Next.js Path -->
    <symbol id="nextjs-logo" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="90" fill="white"/>
      <path d="M149.508 157.52L69.142 54H54V125.97H66.1136V69.1836L139.999 164.345C143.333 162.222 146.503 159.947 149.508 157.52Z" fill="black"/>
      <rect x="115" y="54" width="12" height="72" fill="black"/>
    </symbol>

    <!-- Logo TypeScript -->
    <symbol id="typescript-logo" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#3178c6"/>
      <path d="M70 70 L70 30 L30 30 L30 70 Z" fill="none" />
      <text x="50" y="80" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="white" text-anchor="middle">TS</text>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid decoration -->
  <path d="M0 40 L800 40 M0 80 L800 80 M0 120 L800 120 M0 160 L800 160 M0 200 L800 200 M0 240 L800 240 M0 280 L800 280 M0 320 L800 320 M0 360 L800 360" stroke="#112240" stroke-width="1"/>
  <path d="M40 0 L40 400 M80 0 L80 400 M120 0 L120 400 M160 0 L160 400 M200 0 L200 400 M240 0 L240 400 M280 0 L280 400 M320 0 L320 400 M360 0 L360 400 M400 0 L400 400 M440 0 L440 400 M480 0 L480 400 M520 0 L520 400 M560 0 L560 400 M600 0 L600 400 M640 0 L640 400 M680 0 L680 400 M720 0 L720 400 M760 0 L760 400" stroke="#112240" stroke-width="1"/>

  <!-- Main Content Area -->
  <g transform="translate(400, 200)">
    
    <!-- TypeScript Side -->
    <g transform="translate(-150, 0)">
      <circle r="70" fill="#0a192f" stroke="#e2c275" stroke-width="2" filter="url(#glow)"/>
      <use href="#typescript-logo" x="-35" y="-35" width="70" height="70"/>
      <text y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#e2c275" text-anchor="middle">TypeScript</text>
    </g>

    <!-- Next.js Side -->
    <g transform="translate(150, 0)">
      <circle r="70" fill="#0a192f" stroke="#e2c275" stroke-width="2" filter="url(#glow)"/>
      <use href="#nextjs-logo" x="-40" y="-40" width="80" height="80"/>
      <text y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#e2c275" text-anchor="middle">Next.js</text>
    </g>

    <!-- Innovation Nucleus (IA) -->
    <g id="nucleus">
      <circle r="15" fill="#e2c275" filter="url(#glow)">
        <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" />
      </circle>
      <text y="5" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#0a192f" text-anchor="middle">IA</text>
      
      <!-- Atom Orbit Path Animation -->
      <animateMotion 
        path="M -150,0 C -150,-150 150,150 150,0 C 150,-150 -150,150 -150,0" 
        dur="4s" 
        repeatCount="indefinite" 
        rotate="auto" />
    </g>
    
    <!-- Trail Effect -->
    <path d="M -150,0 C -150,-150 150,150 150,0 C 150,-150 -150,150 -150,0" fill="none" stroke="#e2c275" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>
  </g>

  <!-- Name and Tagline -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#e2c275" text-anchor="middle">EMMANUEL CIFUENTES</text>
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="16" fill="#ccd6f6" text-anchor="middle">Innovation • Strategy • Development</text>

</svg>
